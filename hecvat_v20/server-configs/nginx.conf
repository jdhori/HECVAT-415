# HECVAT 4.1.6 — nginx server block
#
# ⚠ PLACEMENT: this file must be included at http{} level, e.g. dropped into
#   /etc/nginx/conf.d/hecvat.conf. The `map` directive below is only valid in
#   http{} context. If you paste ONLY the server{} block into an existing
#   config and leave `map` behind, nginx refuses to start with:
#       "map" directive is not allowed here
#   If you cannot add anything at http{} level, see NO-MAP VARIANT at the
#   bottom of this file.
#
# Tested on nginx 1.18+
#
# ── WHY THE HEADERS LIVE AT server{} LEVEL ─────────────────────────────
# nginx inherits add_header from an outer level ONLY IF the current level
# declares no add_header of its own. A regex location also takes precedence
# over the prefix location "/". So putting security headers in `location /`
# and a separate `add_header Cache-Control` in `location ~* \.html$` means
# HTML, JS and CSS responses are served by the regex locations and receive
# NO security headers at all — which is every file this tool ships.
#
# The fix: declare every header exactly once, at server{} level, and drive
# Cache-Control from a map variable instead of a per-location add_header, so
# no child level ever declares an add_header and inheritance is never broken.

# Cache policy as a variable — keeps Cache-Control out of location blocks.
map $uri $hecvat_cache {
    default        "no-store";                              # HTML and everything else
    ~*\.(js|css)$  "public, max-age=3600, must-revalidate"; # static assets
}

server {
    listen       443 ssl http2;
    server_name  hecvat.yourdomain.edu;

    # --- TLS (adjust paths to your certificates) ---
    ssl_certificate     /etc/ssl/certs/yourdomain.crt;
    ssl_certificate_key /etc/ssl/private/yourdomain.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Document root (folder containing index.html) ---
    root  /var/www/hecvat;
    index index.html;

    # Remove server version banner
    server_tokens off;

    # ── Security headers ────────────────────────────────────────────
    # Declared once, here, so they apply to EVERY response including
    # .html, .js and .css. Do not add an add_header to any location
    # below or that location will stop inheriting all of these.

    # Content Security Policy — mirrors the meta tag in index.html.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';"
        always;

    # Clickjacking protection (complements frame-ancestors in CSP, and
    # covers it for meta-tag delivery, where frame-ancestors is ignored)
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Do not send Referer header to any destination
    add_header Referrer-Policy "no-referrer" always;

    # Restrict browser feature access
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"
        always;

    # Cache policy from the map above (HTML no-store, JS/CSS 1 hour)
    add_header Cache-Control $hecvat_cache always;

    # HSTS — tell browsers to use HTTPS for 1 year.
    # Only enable once you have confirmed HTTPS is working correctly.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Deny access to hidden files (e.g. .git, .env).
    # `return 404` rather than `deny all` for two reasons: `deny` would make
    # this a 403 that confirms the path exists, and more importantly `return`
    # introduces no add_header, so this location keeps inheriting the
    # server-level security headers above.
    # NOTE: this changes hidden-file responses from 403 to 404 compared with
    # earlier versions of this config — adjust log monitoring if it watched
    # for 403s here.
    location ~ /\. {
        return 404;
    }
}

# Redirect HTTP to HTTPS
server {
    listen      80;
    server_name hecvat.yourdomain.edu;
    return 301  https://$host$request_uri;
}

# ── Verify after deploying ─────────────────────────────────────────────
#   nginx -t && systemctl reload nginx
#   curl -sI https://hecvat.yourdomain.edu/index.html | grep -i -E "content-security|x-frame|x-content|referrer|permissions|cache-control"
#   curl -sI https://hecvat.yourdomain.edu/hecvat-app.js | grep -i -E "content-security|cache-control"
# Both must list the security headers. If index.html shows only Cache-Control,
# an add_header has been reintroduced inside a location block.

# ── NO-MAP VARIANT ─────────────────────────────────────────────────────
# Only if you cannot add a `map` at http{} level. Drop the map block and the
# `add_header Cache-Control $hecvat_cache always;` line, then add cache
# control per location — but you MUST repeat every security header in each
# location, because declaring an add_header there stops all inheritance:
#
#   location ~* \.(js|css)$ {
#       add_header Content-Security-Policy "<same policy as above>" always;
#       add_header X-Frame-Options "DENY" always;
#       add_header X-Content-Type-Options "nosniff" always;
#       add_header Referrer-Policy "no-referrer" always;
#       add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
#       add_header Cache-Control "public, max-age=3600, must-revalidate" always;
#   }
#
# This duplication is why the map approach is preferred: one edit to the CSP
# here cannot silently leave a stale copy behind in a location block.
